# Turkce hata mesajlari — istemci "Accept-Language: tr" gonderdiginde kullanilir.
# Anahtarlar messages.properties ile birebir ayni olmali; bir anahtar burada eksikse Spring
# otomatik olarak varsayilan (Ingilizce) dosyaya duser, yani eksik ceviri hataya yol acmaz.
#
# Dosya UTF-8 okunur (spring.messages.encoding), bu yuzden Turkce karakterler dogrudan
# yazilabilir — \u kacislari gerekmez.

