spring.application.name=backend
spring.jpa.hibernate.ddl-auto=update
server.port=8081

# Yazdırılan SQL sorgularını tek satır yerine, okunabilir şekilde formatlar
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Hibernate SQL loglari console'a BURADAN basilmaz — sadece application-dev.properties'te
# (dev profili aktifken) acilir, boylece prod sessiz kalir. SQL satirlari hangi repository
# metodundan geldigini de tasir (bkz. aop/RepositoryLoggingAspect + application-dev.properties'teki
# logging.pattern.console).

# i18n: hata mesajlari messages.properties (varsayilan/Ingilizce) ve messages_tr.properties'ten
# okunur, dil Accept-Language basligindan secilir (bkz. config/I18nConfig).
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# false: istenen dil desteklenmiyorsa SUNUCUNUN yerel diline degil, varsayilan dosyaya
# (messages.properties, Ingilizce) duselim — yoksa ayni istek sunucunun diline gore farkli
# cevap dondurur, yani sonuc calistigi makineye bagli olur.
spring.messages.fallback-to-system-locale=false

# --- Guvenlik -----------------------------------------------------------------
# JWT imza anahtari. HMAC-SHA256 icin en az 32 bayt olmali, kisasi verilirse uygulama
# acilista WeakKeyException ile durur (sessizce zayif calismaz). Buradaki deger SADECE
# yerel gelistirme icindir; uretimde APP_JWT_SECRET ortam degiskeninden verilmelidir —
# bu anahtari bilen herkes istedigi kullanici adina gecerli token uretebilir.
app.jwt.secret=${APP_JWT_SECRET:yerel-gelistirme-icin-varsayilan-jwt-anahtari-degistirin}
# Token gecerlilik suresi. Kisa tutmanin bedeli sik yeniden giris, uzun tutmanin bedeli
# calinan bir token'in uzun sure gecerli kalmasi — JWT sunucu tarafindan iptal edilemez.
app.jwt.expiration=8h

# Veritabaninda hic kullanici yoksa acilista olusturulacak ilk ADMIN (bkz. config/KullaniciSeeder).
# Dolu bir veritabaninda hicbir sey yapmaz.
app.security.initial-admin.username=${APP_ADMIN_USERNAME:admin}
app.security.initial-admin.password=${APP_ADMIN_PASSWORD:admin123}

# --- Redis (kullanici rol cache'i) ---------------------------------------------
# JwtAuthenticationFilter her istekte kullaniciyi DB'den cekmek yerine once buraya bakar
# (bkz. security/KullaniciRolCacheService). Sadece localhost'ta calisir; docker-compose
# icindeyken SPRING_DATA_REDIS_HOST=redis ortam degiskeni bunu ezer.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# Varsayilan (Lettuce) komut timeout'u 60sn — Redis erisilemez oldugunda KullaniciRolCacheService
# fail-open yapsa bile her istek 60sn'ye kadar beklerdi (test ederken canli gorduk). Cache zaten
# "varsa hizlandirir, yoksa DB'ye duser" mantiginda oldugu icin kisa tutmak guvenli: Redis gercekten
# yavassa da ayni sureden sonra DB'ye dusulur, sadece cok daha hizli fark edilir.
spring.data.redis.timeout=300ms
# Uygulama WebFlux/reactive kullanmiyor (spring-boot-starter-webmvc), ama spring-data-redis
# yine de bir ReactiveRedisConnectionFactory autoconfigure ediyor. Bu, health contributor
# yarisini kazaniyordu: hem sync hem reactive health autoconfigurasyonu ayni bean adini
# ("redisHealthContributor") uretmeye calisiyor, reactive olan once devreye girip @ConditionalOnMissingBean
# ile sync olani engelliyordu — sonuc: HealthContributorRegistry'de "redis" hic gorunmuyordu
# (bkz. requirement-maintenance-audit-backup.md Req-2.2, MaintenanceService#isContributorUp).
# Kullanilmayan reactive autoconfigurasyonu disleyerek sync olanin kazanmasini sagliyoruz.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
# Cache'teki bir kaydin en fazla ne kadar bayat kalabilecegi — asil guncelligi rol
# degisince/kullanici silinince yapilan evict saglar, bu sadece unutulan bir evict icin
# guvenlik agi (bkz. UserRoleCacheService javadoc'u).
app.cache.user-role.ttl-minutes=30
# Ana sayfadaki schema/tag/kullanici listeleri icin @Cacheable TTL'i (bkz. CacheConfig) — bunlar
# ilgili create/rename/delete islemlerinde @CacheEvict ile aninda tazeleniyor, TTL burada da
# ayni sekilde sadece unutulan/atlanan bir evict icin guvenlik agi.
app.cache.workspace.ttl-minutes=15

# --- RabbitMQ (bildirim push kuyrugu) -------------------------------------------
# Bkz. backend/notlar "RabbitMQ koyulacak notification icin", config/RabbitConfig,
# service/NotificationService, websocket/RabbitNotificationListener. docker-compose icindeyken
# SPRING_RABBITMQ_HOST=rabbitmq ortam degiskeni bunu ezer (Redis/MinIO ile ayni desen).
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:dbadmin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guvenlisifrerabbit}
# RabbitNotificationListener bir istisna firlatirsa (ornegin WebSocket JSON serilestirme hatasi)
# once bu kadar yeniden denenir; hepsi tukenirse mesaj queue'nun x-dead-letter-exchange
# argumani sayesinde otomatik olarak DLQ'ya duser (bkz. RabbitConfig). Retry sirasinda
# requeue=true DEGIL — ayni mesaj hemen tekrar kuyruga girip sonsuz dongu yapmasin diye
# Spring'in varsayilan RejectAndDontRequeueRecoverer'i kullanilir.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=200ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=1s

management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- Trace (OpenTelemetry) -------------------------------------------------------
# Tempo'nun OTLP/HTTP receiver'i. docker-compose icindeyken servis adi "tempo" cozuluyor;
# localhost'ta calisirken Tempo container'i yoksa exporter timeout'lu/best-effort oldugu
# icin uygulama yine de acilir, sadece trace gitmez (Req-3.4 fail-open ile ayni mantik).
# Not: Spring Boot 4.x'te property namespace'i management.otlp.* degil management.opentelemetry.*
# altina tasindi (eski isim sessizce yok sayilir, hicbir hata vermez).
management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces
# Dev/staj ortami: gercek prod trafigi yok, amac ogrenme oldugu icin her istek trace'leniyor.
management.tracing.sampling.probability=1.0

spring.datasource.url=jdbc:postgresql://localhost:5433/dbadmin_db
spring.datasource.username=postgres
spring.datasource.password=guvenlisifre

# --- Rapor maili (Scheduler + Async) --------------------------------------------
# Gmail SMTP icin kullanici adi/sifre yerine "uygulama sifresi" gerekir (normal Gmail
# sifresiyle SMTP girisi artik engelleniyor) — bkz. requirement-scheduler-report.md Req-3.5.
# Buradaki degerler SADECE yerel gelistirme icindir; uretimde ortam degiskenlerinden verilmelidir.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Raporun gonderilecegi adres — Kullanici entity'sinde email alani olmadigi icin (bkz.
# plan-scheduler-report-implementation.md Faz 1) bir kullanici satirina degil, yapilandirmaya bagli.
app.report.admin-email=${APP_REPORT_ADMIN_EMAIL:}
# spring-boot-starter-mail otomatik olarak /actuator/health'e bir mail sağlık kontrolü ekliyor.
# Iki sorun cikardi: (1) gercek SMTP kimlik bilgisi yoksa health DOWN'a duser (Req-3.2'nin ruhuyla
# celisir: rapor fail-open, ana uygulamanin sagligini etkilememeli), (2) sadece somut
# JavaMailSenderImpl'i tanidigi icin testlerde JavaMailSender'i mock'lamak "'beans' must not be
# empty" hatasiyla ApplicationContext'in hic yuklenmemesine yol aciyordu. Kapatildi.
management.health.mail.enabled=false

# --- Audit log yedekleme (MinIO) --------------------------------------------------
# bkz. requirement-maintenance-audit-backup.md. Buradaki degerler SADECE yerel gelistirme
# icindir (docker-compose.yml disinda `mvnw spring-boot:run` ile calistirilirsa MinIO'nun
# localhost:9000'de erisilebilir oldugu varsayilir); uretimde ortam degiskenlerinden verilmelidir.
# Access/secret key defaultlari .env'deki MINIO_ROOT_USER/PASSWORD ile ayni (docker-compose
# disinda calistirildiginda da bir MinIO'ya baglanabilmek icin) — MinioClient bean'i bos
# credential kabul etmiyor (bkz. config/MinioConfig), bu yuzden JWT/mail'den farkli olarak
# burasi bos birakilamaz.
app.minio.endpoint=${APP_MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${APP_MINIO_ACCESS_KEY:dbadmin_minio}
app.minio.secret-key=${APP_MINIO_SECRET_KEY:guvenlisifreminio}
app.minio.bucket=${APP_MINIO_BUCKET:audit-log-backups}

# --- Maintenance: servis sagligi (Req-2.2) ----------------------------------------
# Postgres/Redis icin Spring Boot kendi health contributor'unu otomatik uretiyor (DataSource ve
# spring-data-redis classpath'te oldugu icin) — burasi sadece Tempo/Loki icindir, ikisi de
# Spring-managed bir kaynak degil, otomatik bir contributor yok. Ayni "tempo"/"loki" service-name
# konvansiyonu (bkz. yukaridaki OTLP endpoint yorumu): localhost'ta calisirken bu container'lar
# yoksa istek timeout'la basarisiz olur, DOWN gosterilir — uygulamanin acilmasini engellemez.
app.maintenance.tempo-ready-url=http://tempo:3200/ready
app.maintenance.loki-ready-url=http://loki:3100/ready