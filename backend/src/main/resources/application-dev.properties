# Sadece 'dev' profili aktifken yuklenir (SPRING_PROFILES_ACTIVE=dev).
# Profil aktif degilse bu dosya hic okunmaz, dolayisiyla prod'da SQL loglari kapali kalir.

# --- Hibernate'in calistirdigi SQL sorgulari ---
logging.level.org.hibernate.SQL=DEBUG

# Sorgular tek satir bassin (format_sql=true olsaydi her sorgu ~10 satir olurdu)
spring.jpa.properties.hibernate.format_sql=false

# Parametre degerlerini ('?' yerine gelen veriler) gormek isterseniz asagidaki
# satiri acin. Cok gurultu yapar ve her degeri duz metin loglar - prod'da asla.
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Konsol log formati ---
# Varsayilan Spring formatinda satirin yarisi ise yaramayan bilgi: tam tarih, PID,
# "--- [backend]" ve uzun thread adi. Hepsini atip 4 sutuna indiriyoruz:
#
#   14:31:11.449 DEBUG SQL           : select t1_0.id from tablo t1_0 where t1_0.name=?
#   |            |     |               |
#   |            |     |               +-- mesaj (SQL'in kendisi)
#   |            |     +------------------ kim yazdi (SQL = Hibernate)
#   |            +------------------------ seviye
#   +------------------------------------- saat (container UTC calisir, ekranda TR saati gorunsun)
#
# %logger{0} = paket adi olmadan sadece sinif adi.
# %-20logger{0} = en az 20 karaktere kadar bosluk ekle, ama UZUN ISMI KIRPMA.
# (%-20.20 yazsaydik uzun isimler soldan kirpilirdi: LocalValidatorFactoryBean -> orFactoryBean)
logging.pattern.console=%clr(%d{HH:mm:ss.SSS, Europe/Istanbul}){faint} %clr(%-5p) %clr(%-20logger{0}){cyan} %clr(:){faint} %m%n
