# Sadece 'dev' profili aktifken yuklenir (SPRING_PROFILES_ACTIVE=dev).
# Profil aktif degilse bu dosya hic okunmaz, dolayisiyla prod'da SQL loglari kapali kalir.

# --- Hibernate'in calistirdigi SQL sorgulari ---
# show-sql=true yerine logger uzerinden aciyoruz: show-sql, Hibernate'in SLF4J/Logback'i
# hic gormeden dogrudan System.out'a yazdigi eski bir yontem - asagidaki RepositoryLoggingAspect'in
# MDC'ye koydugu "hangi repository metodu cagirdi" bilgisi ile logging.pattern.console'daki
# %X{repo}, sadece logger'dan geçen satirlarda calisir. show-sql kapali kalinca bu etiket kaybolmaz.
#logging.level.org.hibernate.SQL=DEBUG

# Yazdırılan SQL sorgularını tek satır yerine, okunabilir şekilde formatlar
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Parametre degerlerini ('?' yerine gelen veriler) gormek isterseniz asagidaki
# satiri acin. Cok gurultu yapar ve her degeri duz metin loglar - prod'da asla.
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Konsol log formati ---
# Varsayilan Spring formatinda satirin yarisi ise yaramayan bilgi: tam tarih, PID,
# "--- [backend]" ve uzun thread adi. Hepsini atip 5 sutuna indiriyoruz:
#
#   14:31:11.449 DEBUG SQL           : [TabloRepository.findById(..)] select t1_0.id from tablo t1_0 where t1_0.id=?
#   |            |     |               |                              |
#   |            |     |               |                              +-- mesaj (SQL'in kendisi)
#   |            |     |               +-- RepositoryLoggingAspect'in MDC'ye yazdigi cagiran metod (bos ise "[]")
#   |            |     +------------------ kim yazdi (SQL = Hibernate)
#   |            +------------------------ seviye
#   +------------------------------------- saat (container UTC calisir, ekranda TR saati gorunsun)
#
# %logger{0} = paket adi olmadan sadece sinif adi.
# %-20logger{0} = en az 20 karaktere kadar bosluk ekle, ama UZUN ISMI KIRPMA.
# (%-20.20 yazsaydik uzun isimler soldan kirpilirdi: LocalValidatorFactoryBean -> orFactoryBean)
# %X{repo} = MDC'deki "repo" alani; repository disindan gelen (SQL disi) loglarda bos kalir.
# %X{traceId}/%X{spanId} = OTel bridge'in (bkz. SpanRunner) her spana girip cikarken otomatik
# MDC'ye yazdigi degerler — aktif bir span yoksa (ör. uygulama baslangic loglari) bos kalir.
# Bu ikisi sayesinde bir trace'e Grafana'da tikladiginda Loki'de ayni trace_id'yi tasiyan
# log satirlari filtrelenebilir (Req-2.3).
#
# NOT: Bu satir 31 Temmuz "redis eklendi" commit'inde yorum yeniden duzenlenirken yanlislikla
# silinmis (git log ile dogrulandi) — konsol o zamandan beri Spring'in varsayilan formatini
# kullaniyordu; burada hem eski format geri getirildi hem trace/span eklendi.
logging.pattern.console=%clr(%d{HH:mm:ss.SSS, Europe/Istanbul}){faint} %clr(%-5p) %clr(%-20logger{0}){cyan} %clr(:){faint} %clr([%X{repo}]){magenta} %clr([trace=%X{traceId:-},span=%X{spanId:-}]){blue} %m%n