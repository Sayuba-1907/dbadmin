# Varsayilan (Ingilizce) hata mesajlari — Accept-Language basligi yoksa ya da desteklenmeyen
# bir dil istenirse bu dosya kullanilir (bkz. config/I18nConfig).
#
# Anahtarlar hata kodlarinin ta kendisi (ErrorResponse.code). Boylece tek bir kod hem
# frontend'in i18next sozlugunde hem burada ayni anahtarla aranir.
#
# Yer tutucular {{name}} / {{id}} seklinde ve degerleri exception'in "details" map'inden
# doldurulur (bkz. GlobalExceptionHandler). MessageFormat'in {0} sozdizimi yerine bunu
# kullaniyoruz: frontend'in ceviri dosyalari (tr.json/en.json) da ayni sozdizimini kullaniyor,
# boylece iki taraftaki metinler birebir karsilastirilabiliyor ve details'teki anahtarin adi
# metinden okunabiliyor (siraya bagli {0} degil).

VALIDATION_INVALID_TABLE_NAME=table name must be 2-30 characters, must not start with an uppercase letter, and may only contain letters, digits and underscore
VALIDATION_INVALID_COLUMN_NAME=column name must be 2-30 characters, must not start with an uppercase letter, and may only contain letters, digits and underscore
VALIDATION_INVALID_SCHEMA_NAME=schema name must be 2-30 characters, must not start with an uppercase letter, and may only contain letters, digits and underscore
VALIDATION_INVALID_TAG_NAME=tag name must be 2-30 characters, must not start with an uppercase letter, and may only contain letters, digits and underscore
VALIDATION_INVALID_COLUMN_TYPE=type must be one of: numeric, text, datetime, boolean
VALIDATION_TABLE_NEEDS_COLUMN=a table needs at least one column
VALIDATION_MISSING_SCHEMA=a schema must be specified
VALIDATION_RESERVED_SCHEMA_NAME='{{name}}' is a reserved schema name and cannot be used

NOT_FOUND_TABLE=tablo not found: {{id}}
NOT_FOUND_COLUMN=column not found in this table: {{id}}
NOT_FOUND_SCHEMA=schema not found: {{id}}
NOT_FOUND_TAG=tag not found: {{id}}

CONFLICT_DUPLICATE_TABLE_NAME=a table named '{{name}}' already exists
CONFLICT_DUPLICATE_COLUMN_NAME=a column named '{{name}}' already exists in this table
CONFLICT_DUPLICATE_COLUMN_IN_REQUEST=duplicate column name in request: {{name}}
CONFLICT_DUPLICATE_SCHEMA_NAME=a schema named '{{name}}' already exists
CONFLICT_DUPLICATE_TAG_NAME=a tag named '{{name}}' already exists
CONFLICT_COLUMN_NOT_UNIQUE=the operation conflicts with the table's current data (e.g. a column being made primary key contains null or duplicate values)

# Bu bolumdekiler uygulamanin kendi exception'larindan degil, Spring'in girdi/istek katmaninin
# kendiliginden firlattigi exception'lardan gelir (bkz. GlobalExceptionHandler) — asagidaki
# {{...}} yer tutuculari o exception'larin kendi alanlarindan (parametre adi, HTTP metodu, vs)
# dolduruluyor.
VALIDATION_INVALID_PATH_PARAM={{parameter}} must be a valid {{type}}: {{value}}
VALIDATION_MALFORMED_BODY=request body is missing or not valid JSON
VALIDATION_METHOD_NOT_ALLOWED=method {{method}} is not supported here, use one of: {{supported}}
NOT_FOUND_ENDPOINT=no endpoint at this path: {{path}}
INTERNAL_ERROR=an unexpected error occurred

# Kimlik dogrulama / yetkilendirme. Bu kodlarin bir kismi Spring Security'nin filtre
# zincirinden gelir (bkz. security/RestSecurityErrorHandler), yani GlobalExceptionHandler'in
# hic gormedigi yollardan uretilir — ama govde ve ceviri mekanizmasi ayni.
AUTH_INVALID_CREDENTIALS=invalid username or password
AUTH_REQUIRED=authentication is required, send a valid Bearer token
AUTH_FORBIDDEN=your role is not allowed to perform this operation
VALIDATION_INVALID_USERNAME=username must be 2-30 characters, must not start with an uppercase letter, and may only contain letters, digits and underscore
VALIDATION_WEAK_PASSWORD=password must be at least {{min}} characters
VALIDATION_MISSING_ROLE=a role must be specified
NOT_FOUND_USER=user not found: {{id}}
CONFLICT_DUPLICATE_USERNAME=a user named '{{name}}' already exists
CONFLICT_LAST_ADMIN=the last remaining admin cannot be removed or demoted
