<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Redis role-cache mechanism</title>
  <desc>The JwtAuthenticationFilter looks up the requesting user's role in a Redis Hash (user:role:username). On a cache hit the role is used directly; on a miss it falls back to Postgres and writes the result back to Redis with a 30-minute TTL. A role change or user deletion explicitly evicts the cache entry instead of waiting for the TTL. If Redis is unreachable, the filter falls through to Postgres and the request still succeeds (fail-open).</desc>

  <defs>
    <marker id="arrow-redis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="640" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">Redis — role cache</text>
  <text x="380" y="50" text-anchor="middle" font-size="11.5" fill="#64748b">why it's here: learn get/put/evict/TTL explicitly, not hidden behind @Cacheable</text>

  <rect x="290" y="76" width="180" height="42" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="380" y="102" text-anchor="middle" font-size="11.5" fill="#1e293b">HTTP request</text>

  <line x1="380" y1="118" x2="380" y2="151" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow-ink)"/>

  <rect x="260" y="152" width="240" height="50" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="380" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">JwtAuthenticationFilter</text>

  <line x1="380" y1="202" x2="380" y2="235" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-redis)"/>
  <text x="398" y="222" font-size="10" fill="#64748b">role lookup</text>

  <rect x="230" y="236" width="300" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="380" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Redis Hash</text>
  <text x="380" y="282" text-anchor="middle" font-size="10.5" font-family="Consolas, Monaco, monospace" fill="#7f1d1d">user:role:&lt;username&gt;</text>

  <line x1="310" y1="300" x2="190" y2="360" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-redis)"/>
  <text x="220" y="338" font-size="10.5" fill="#64748b">hit</text>
  <rect x="90" y="362" width="220" height="44" rx="22" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="200" y="389" text-anchor="middle" font-size="11" fill="#991b1b">role — no DB round-trip</text>

  <line x1="450" y1="300" x2="570" y2="360" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-redis)"/>
  <text x="540" y="338" font-size="10.5" fill="#64748b">miss</text>
  <rect x="480" y="362" width="150" height="40" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
  <text x="555" y="387" text-anchor="middle" font-size="11" fill="#1e293b">cache miss</text>

  <line x1="555" y1="402" x2="555" y2="435" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
  <rect x="430" y="436" width="250" height="52" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="555" y="467" text-anchor="middle" font-size="11.5" fill="#1e293b">Postgres — users table</text>

  <path d="M430,460 Q340,380 500,290" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-redis)"/>
  <text x="330" y="400" font-size="10" fill="#7f1d1d">write-through, TTL 30m</text>

  <rect x="230" y="510" width="300" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="380" y="538" text-anchor="middle" font-size="11" fill="#475569">role changed / user deleted</text>

  <text x="380" y="580" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">→ explicit evict(), doesn't wait for the TTL</text>

  <line x1="140" y1="600" x2="620" y2="600" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="620" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">Redis unreachable → falls through to Postgres, request still succeeds (fail-open, 300ms timeout)</text>
</svg>
