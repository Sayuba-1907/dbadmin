<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>RabbitMQ notification delivery mechanism</title>
  <desc>When a user changes a table owned by someone else, TableService.applyChanges publishes a notification event to a RabbitMQ queue only when the transaction commits — a rollback publishes nothing. RabbitNotificationListener consumes the message and pushes it to the owner's WebSocket session. A message that fails processing is retried a limited number of times before landing in a Dead Letter Queue instead of being silently lost.</desc>

  <defs>
    <marker id="arrow-mq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="640" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">RabbitMQ — notification delivery</text>
  <text x="380" y="50" text-anchor="middle" font-size="11.5" fill="#64748b">why it's here: learn a durable queue + fan-out/fan-in, replacing an in-process event</text>

  <rect x="270" y="76" width="220" height="42" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="380" y="102" text-anchor="middle" font-size="11" fill="#1e293b">Table changed by non-owner</text>

  <line x1="380" y1="118" x2="380" y2="151" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow-ink)"/>

  <rect x="250" y="152" width="260" height="48" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="380" y="181" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">TableService.applyChanges</text>

  <line x1="380" y1="200" x2="380" y2="233" stroke="#ea580c" stroke-width="1.4" marker-end="url(#arrow-mq)"/>
  <text x="398" y="221" font-size="10" fill="#64748b">publish — commit only</text>

  <rect x="250" y="234" width="260" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="380" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">RabbitMQ queue</text>
  <text x="380" y="280" text-anchor="middle" font-size="10.5" fill="#9a3412">notifications</text>

  <line x1="380" y1="296" x2="380" y2="329" stroke="#ea580c" stroke-width="1.4" marker-end="url(#arrow-mq)"/>
  <text x="398" y="317" font-size="10" fill="#64748b">consume</text>

  <rect x="230" y="330" width="300" height="48" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="380" y="359" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">RabbitNotificationListener</text>

  <line x1="380" y1="378" x2="380" y2="411" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow-ink)"/>

  <rect x="230" y="412" width="300" height="52" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="380" y="434" text-anchor="middle" font-size="11.5" fill="#1e293b">WebSocket push to</text>
  <text x="380" y="450" text-anchor="middle" font-size="11.5" fill="#1e293b">owner's active session</text>

  <line x1="530" y1="354" x2="579" y2="354" stroke="#ea580c" stroke-width="1.4" marker-end="url(#arrow-mq)"/>
  <text x="555" y="341" text-anchor="middle" font-size="9" fill="#64748b">fails</text>
  <rect x="580" y="330" width="150" height="48" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="655" y="350" text-anchor="middle" font-size="10.5" fill="#9a3412">retry</text>
  <text x="655" y="365" text-anchor="middle" font-size="9" fill="#64748b">limited attempts</text>

  <line x1="655" y1="378" x2="655" y2="411" stroke="#ea580c" stroke-width="1.4" marker-end="url(#arrow-mq)"/>
  <rect x="580" y="412" width="150" height="52" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="655" y="434" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a3412">Dead Letter</text>
  <text x="655" y="450" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a3412">Queue</text>

  <line x1="140" y1="520" x2="620" y2="520" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="544" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">Publish is tied to the transaction — a rollback publishes nothing,</text>
  <text x="380" y="562" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">and a message that can't be processed lands in the DLQ instead of vanishing</text>
</svg>
