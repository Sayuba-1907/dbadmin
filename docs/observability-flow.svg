<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Observability pipeline: backend to Grafana</title>
  <desc>The Spring Boot backend is instrumented with OpenTelemetry and exports directly to Tempo (traces) and Loki (structured logs) — no OTel Collector in between, a deliberate choice since there is exactly one trace backend and one log backend. Every log line carries the active trace id, so a single log line can be followed straight to the full trace it happened inside. Metrics are exposed on /actuator/prometheus and pulled (scraped) by Prometheus every 15 seconds, not pushed. postgres_exporter adds database-level metrics the same way. Grafana queries all three and lets a user jump from a log line to its trace.</desc>

  <defs>
    <marker id="arrow-trace" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-log" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-metric" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-graf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">Backend → Grafana — three signals, one correlation id</text>
  <text x="450" y="50" text-anchor="middle" font-size="11.5" fill="#64748b">no OTel Collector — exactly one trace backend and one log backend, so direct export was simpler</text>

  <rect x="300" y="76" width="300" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="450" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Spring Boot backend</text>
  <text x="450" y="120" text-anchor="middle" font-size="10" fill="#475569">OpenTelemetry SDK — every log line carries the active trace id</text>

  <!-- traces -->
  <line x1="330" y1="136" x2="220" y2="219" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-trace)"/>
  <text x="210" y="180" text-anchor="middle" font-size="10" fill="#6d28d9">spans (OTLP)</text>
  <rect x="90" y="220" width="220" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="200" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Tempo</text>
  <text x="200" y="260" text-anchor="middle" font-size="9.5" fill="#6d28d9">distributed traces</text>

  <!-- logs -->
  <line x1="450" y1="136" x2="450" y2="219" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-log)"/>
  <text x="466" y="182" font-size="10" fill="#15803d">structured logs</text>
  <text x="466" y="196" font-size="10" fill="#15803d">+ trace id</text>
  <rect x="340" y="220" width="220" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="450" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Loki</text>
  <text x="450" y="260" text-anchor="middle" font-size="9.5" fill="#15803d">structured logs</text>

  <!-- metrics (pull) -->
  <rect x="590" y="220" width="220" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="700" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Prometheus</text>
  <text x="700" y="260" text-anchor="middle" font-size="9.5" fill="#9a3412">metrics, pulled every 15s</text>
  <line x1="700" y1="220" x2="600" y2="136" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-metric)"/>
  <text x="705" y="180" text-anchor="middle" font-size="10" fill="#9a3412">scrapes</text>
  <text x="705" y="194" text-anchor="middle" font-size="10" fill="#9a3412">/actuator/prometheus</text>

  <rect x="620" y="90" width="30" height="16" fill="none"/>
  <rect x="650" y="330" width="220" height="46" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="760" y="358" text-anchor="middle" font-size="10.5" fill="#1e293b">postgres_exporter</text>
  <line x1="760" y1="330" x2="740" y2="276" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-metric)"/>
  <text x="782" y="305" font-size="9.5" fill="#9a3412">db metrics</text>

  <!-- convergence into Grafana -->
  <line x1="200" y1="276" x2="380" y2="440" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow-graf)"/>
  <line x1="450" y1="276" x2="450" y2="439" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow-graf)"/>
  <line x1="700" y1="276" x2="520" y2="440" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow-graf)"/>

  <rect x="330" y="440" width="240" height="66" rx="10" fill="#f8fafc" stroke="#1e293b" stroke-width="1.6"/>
  <text x="450" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Grafana</text>
  <text x="450" y="486" text-anchor="middle" font-size="10" fill="#475569">one dashboard, all three signals</text>

  <line x1="140" y1="540" x2="760" y2="540" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="564" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">The point isn't logging in isolation — it's jumping from one log line straight to</text>
  <text x="450" y="582" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">the full trace it happened inside of, instead of correlating two tools by timestamp</text>
</svg>
