<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 580" width="1400" height="580" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="580" fill="#ffffff"/>

  <text x="700" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">DBAdmin — Architecture</text>

  <!-- group containers -->
  <rect x="60" y="330" width="580" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="350" y="356" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#475569">DATA</text>

  <rect x="680" y="330" width="660" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1010" y="356" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#475569">OBSERVABILITY</text>

  <!-- arrows: backend fan-out (drawn first, under boxes) -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M590,254 L110,380"/>
    <path d="M626.7,254 L280,380"/>
    <path d="M663.3,254 L420,380"/>
    <path d="M700,254 L560,380"/>
    <path d="M736.7,254 L880,380"/>
    <path d="M773.3,254 L1005,380"/>
    <path d="M810,254 L1130,380"/>
    <path d="M700,114 L700,190"/>
    <path d="M810,425 L825,425"/>
    <path d="M880,470 Q1067,510 1200,470"/>
    <path d="M1005,470 Q1120,505 1200,470"/>
    <path d="M1130,470 Q1175,495 1200,470"/>
  </g>

  <text x="700" y="156" text-anchor="middle" font-size="12" fill="#334155" style="paint-order: stroke; stroke: #ffffff; stroke-width: 5px;">REST /api</text>

  <!-- Browser -->
  <rect x="590" y="50" width="220" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="700" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Browser</text>
  <text x="700" y="94" text-anchor="middle" font-size="11" fill="#475569">React + TypeScript · :3000</text>

  <!-- Backend -->
  <rect x="590" y="190" width="220" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="700" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Spring Boot Backend</text>
  <text x="700" y="234" text-anchor="middle" font-size="11" fill="#475569">Java 21 · :8081</text>

  <!-- Data boxes -->
  <rect x="80" y="380" width="120" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="140" y="402" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">PostgreSQL 15</text>
  <text x="140" y="418" text-anchor="middle" font-size="10" fill="#475569">JPA metadata</text>
  <text x="140" y="431" text-anchor="middle" font-size="10" fill="#475569">+ JdbcTemplate DDL</text>

  <rect x="220" y="380" width="120" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="280" y="410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">Redis</text>
  <text x="280" y="428" text-anchor="middle" font-size="10" fill="#475569">cache</text>

  <rect x="360" y="380" width="120" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="420" y="410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">RabbitMQ</text>
  <text x="420" y="428" text-anchor="middle" font-size="10" fill="#475569">notifications</text>

  <rect x="500" y="380" width="120" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="560" y="410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">MinIO</text>
  <text x="560" y="428" text-anchor="middle" font-size="10" fill="#475569">audit backups</text>

  <!-- Observability boxes -->
  <rect x="700" y="380" width="110" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="755" y="406" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">postgres_</text>
  <text x="755" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">exporter</text>
  <text x="755" y="436" text-anchor="middle" font-size="10" fill="#475569">db stats</text>

  <rect x="825" y="380" width="110" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="880" y="410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Prometheus</text>
  <text x="880" y="428" text-anchor="middle" font-size="10" fill="#475569">scrapes exporters</text>

  <rect x="950" y="380" width="110" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1005" y="410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Tempo</text>
  <text x="1005" y="428" text-anchor="middle" font-size="10" fill="#475569">traces</text>

  <rect x="1075" y="380" width="110" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1130" y="410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Loki</text>
  <text x="1130" y="428" text-anchor="middle" font-size="10" fill="#475569">logs</text>

  <rect x="1200" y="380" width="110" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1255" y="410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Grafana</text>
  <text x="1255" y="428" text-anchor="middle" font-size="10" fill="#475569">dashboards</text>

  <text x="700" y="565" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">Every write happens twice: JPA metadata + real Postgres DDL, in one transaction.</text>
</svg>
