<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>DBAdmin dual-write mechanism</title>
  <desc>A table/column change flows from the browser into one Spring Boot transactional method. The name is validated once, then two writers run: Hibernate/JPA writes metadata rows (tables, columns, tag), and a JdbcTemplate DDL executor builds and runs the real CREATE/ALTER/DROP TABLE statement by string concatenation. Both land on the same PostgreSQL database. The DDL is not covered by the transaction's rollback the way the metadata write is.</desc>

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-jpa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-ddl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="800" fill="#ffffff"/>

  <text x="550" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">The dual write</text>
  <text x="550" y="46" text-anchor="middle" font-size="12" fill="#64748b">Every table/column change in DBAdmin writes twice, from inside one transaction</text>

  <!-- transaction boundary -->
  <rect x="40" y="140" width="1020" height="360" rx="18" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="120" y="128" width="260" height="24" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="250" y="144" text-anchor="middle" font-size="11" fill="#64748b">single @Transactional method</text>

  <!-- Browser -->
  <rect x="450" y="66" width="200" height="50" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="550" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Browser</text>
  <text x="550" y="104" text-anchor="middle" font-size="10" fill="#64748b">edits a table</text>

  <line x1="550" y1="116" x2="550" y2="159" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <text x="568" y="141" font-size="10" fill="#64748b">REST /api</text>

  <!-- Backend -->
  <rect x="400" y="160" width="300" height="56" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="550" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Spring Boot backend</text>
  <text x="550" y="200" text-anchor="middle" font-size="10" fill="#64748b">TableService — one write, one method</text>

  <line x1="550" y1="216" x2="550" y2="259" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <text x="568" y="241" font-size="10" fill="#64748b">validated name</text>

  <!-- Validation gate -->
  <rect x="330" y="260" width="440" height="66" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="550" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">NameValidator</text>
  <text x="550" y="300" text-anchor="middle" font-size="9.5" fill="#475569">2–30 chars · must not start uppercase · letters / digits / underscore only</text>
  <text x="550" y="314" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">the only guard before the DDL string below gets built</text>

  <!-- fan-out -->
  <line x1="450" y1="326" x2="195" y2="371" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow-jpa)"/>
  <line x1="650" y1="326" x2="915" y2="371" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-ddl)"/>

  <!-- JPA node -->
  <rect x="60" y="372" width="260" height="118" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="190" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Hibernate / JPA</text>
  <text x="190" y="412" text-anchor="middle" font-size="10" fill="#64748b">org.hibernate.SQL</text>

  <rect x="67" y="426" width="74" height="24" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="104" y="442" text-anchor="middle" font-size="9.5" fill="#3730a3">tables</text>
  <rect x="153" y="426" width="74" height="24" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="190" y="442" text-anchor="middle" font-size="9.5" fill="#3730a3">columns</text>
  <rect x="239" y="426" width="74" height="24" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="276" y="442" text-anchor="middle" font-size="9.5" fill="#3730a3">tag</text>

  <text x="190" y="472" text-anchor="middle" font-size="9" fill="#64748b">writes/updates metadata rows</text>

  <!-- DDL node -->
  <rect x="780" y="372" width="280" height="118" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="920" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">JdbcTemplate executor</text>
  <text x="920" y="412" text-anchor="middle" font-size="9.5" fill="#64748b">TableDdlExecutor / SchemaDdlExecutor</text>

  <rect x="790" y="424" width="260" height="50" rx="6" fill="#1e293b"/>
  <text x="800" y="442" font-size="9" font-family="Consolas, Monaco, monospace" fill="#fbbf24">ALTER TABLE "products"</text>
  <text x="800" y="458" font-size="9" font-family="Consolas, Monaco, monospace" fill="#fbbf24">ADD COLUMN "price" numeric;</text>

  <!-- convergence -->
  <line x1="190" y1="490" x2="465" y2="587" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow-jpa)"/>
  <line x1="920" y1="490" x2="635" y2="587" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-ddl)"/>

  <!-- Postgres cylinder -->
  <rect x="430" y="588" width="240" height="76" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
  <ellipse cx="550" cy="664" rx="120" ry="16" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
  <ellipse cx="550" cy="588" rx="120" ry="16" fill="#3f4f66" stroke="#1e293b" stroke-width="1.5"/>
  <text x="550" y="623" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PostgreSQL 15</text>
  <text x="550" y="641" text-anchor="middle" font-size="10" fill="#cbd5e1">one real database</text>

  <text x="550" y="702" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">Postgres DDL isn't covered by the transaction's rollback the way the metadata write is —</text>
  <text x="550" y="718" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">if the DDL succeeds and something fails after, it stays applied.</text>

  <line x1="140" y1="746" x2="960" y2="746" stroke="#e2e8f0" stroke-width="1"/>
  <text x="550" y="766" text-anchor="middle" font-size="11" fill="#94a3b8">Also talks to: Redis (cache) · RabbitMQ (notifications) · MinIO (audit backups) · Prometheus / Grafana / Tempo / Loki (observability)</text>
</svg>
