apiVersion: 1

groups:
  - orgId: 1
    name: dbadmin-backend-alerts
    folder: DBAdmin Alerts
    interval: 1m
    rules:
      - uid: dbadmin-backend-down
        title: Backend is down
        condition: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus can't scrape dbadmin-backend"
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'up{job="dbadmin-backend"}'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["A"]
                  reducer:
                    type: last
                  type: query

      - uid: dbadmin-high-error-rate
        title: High 5xx error rate
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing with 5xx"
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '100 * sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m]))'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
                  operator:
                    type: and
                  query:
                    params: ["A"]
                  reducer:
                    type: last
                  type: query

      - uid: dbadmin-db-pool-saturation
        title: DB connection pool near capacity
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP active connections are above 80% of the configured max"
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "hikaricp_connections_active / hikaricp_connections_max"
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  query:
                    params: ["A"]
                  reducer:
                    type: last
                  type: query
