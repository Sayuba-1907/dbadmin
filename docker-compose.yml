services:
  db:
    image: postgres:15-alpine
    container_name: dbadmin_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dbadmin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: dbadmin_postgres_exporter
    environment:
      DATA_SOURCE_URI: "db:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dbadmin-net

  redis:
    image: redis:7-alpine
    container_name: dbadmin_redis
    expose:
      - "6379"
    networks:
      - dbadmin-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis'i tarayicidan gorsel incelemek icin (Grafana/Prometheus ile ayni mantik). Ilk acilista
  # "Add Redis database" ekraninda host=redis, port=6379 girilmesi yeterli (sifre yok).
  redisinsight:
    image: redis/redisinsight:latest
    container_name: dbadmin_redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dbadmin-net

  tempo:
    # 3.x, Kafka gerektiren yeni "live-store" mimarisine gecti (tek container'lik dev ortami
    # icin gereksiz karmasik). 2.x serisi, local storage'a yazan klasik tek-binary mimariyi
    # kullanmaya devam ediyor — bizim icin yeterli.
    image: grafana/tempo:2.7.1
    container_name: dbadmin_tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    expose:
      - "4317" # OTLP gRPC
      - "4318" # OTLP HTTP (backend buraya gonderiyor)
      - "3200" # Tempo'nun kendi API'si, Grafana buradan okuyor
    networks:
      - dbadmin-net

  loki:
    # Tempo'daki gibi Kafka gerektiren yeni mimarilerden kaçınmak için 2.x serisine sabitliyoruz.
    image: grafana/loki:2.9.4
    container_name: dbadmin_loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - dbadmin-net

  minio:
    # Audit log yedeklerinin (bkz. requirement-maintenance-audit-backup.md) yazildigi object
    # storage. Console (9001) Redisinsight/Grafana gibi tarayicidan gorsel incelemek icin host'a
    # aciliyor; API portu (9000) sadece backend'in erisebilecegi sekilde expose ediliyor.
    image: minio/minio:latest
    container_name: dbadmin_minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - dbadmin-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dbadmin_backend
    environment:
      # 'dev' profili application-dev.properties'i yukler (Hibernate SQL loglari).
      # Prod'a cikarken bu satir kaldirilmali.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # JWT imza anahtari. Bu anahtari bilen herkes istedigi kullanici adina gecerli token
      # uretebilir — .env'den gelmeli, koda/compose'a yazilmamali. En az 32 bayt olmali.
      APP_JWT_SECRET: ${APP_JWT_SECRET:-yerel-gelistirme-icin-varsayilan-jwt-anahtari-degistirin}
      # Veritabani bossa acilista olusturulacak ilk ADMIN (bkz. config/KullaniciSeeder).
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
      # Saatlik rapor maili (bkz. requirement-scheduler-report.md). Gmail app password
      # kullanilir, normal sifre degil — .env'den gelmeli, sabit yazilmamali.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_REPORT_ADMIN_EMAIL: ${APP_REPORT_ADMIN_EMAIL:-}
      # MinIO'ya audit log yedegi yazarken kullanilan kimlik (bkz.
      # requirement-maintenance-audit-backup.md). Root credential'la ayni deger, .env'den gelir.
      APP_MINIO_ENDPOINT: http://minio:9000
      APP_MINIO_ACCESS_KEY: ${APP_MINIO_ACCESS_KEY:-}
      APP_MINIO_SECRET_KEY: ${APP_MINIO_SECRET_KEY:-}
      APP_MINIO_BUCKET: ${APP_MINIO_BUCKET:-audit-log-backups}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "8081:8081"
    networks:
      - dbadmin-net

  frontend:
    build: ./frontend
    container_name: dbadmin_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dbadmin-net

  prometheus:
    image: prom/prometheus:latest
    container_name: dbadmin_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - dbadmin-net

  grafana:
    image: grafana/grafana:latest
    container_name: dbadmin_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - dbadmin-net

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  redisinsight_data:
  tempo_data:
  loki_data:
  minio_data:

networks:
  dbadmin-net:
    driver: bridge
